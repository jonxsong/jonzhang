<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Jon Zhang portfolio</title>
  <desc id="desc">A gradient banner for Jon Zhang, GenAI and full-stack engineer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f76ba"/>
      <stop offset=".42" stop-color="#ee8c8b"/>
      <stop offset=".76" stop-color="#ffd3a8"/>
      <stop offset="1" stop-color="#8db2ec"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#5654a8" stop-opacity=".62"/><stop offset="1" stop-color="#5654a8" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#26345f" flood-opacity=".18"/></filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#sky)"/>
  <circle cx="180" cy="40" r="330" fill="url(#glowA)"/>
  <circle cx="1090" cy="80" r="370" fill="url(#glowB)"/>
  <path d="M0 105H1200M0 210H1200M0 315H1200M300 0V420M600 0V420M900 0V420" stroke="#fff" stroke-opacity=".1"/>
  <rect width="1200" height="420" rx="32" filter="url(#grain)" opacity=".55"/>

  <g transform="translate(72 62)">
    <text x="0" y="58" fill="#11141a" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="600" letter-spacing="-6">JZ</text>
    <circle cx="91" cy="52" r="6" fill="#3367ff"/>
    <text x="0" y="142" fill="#11141a" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="600" letter-spacing="-3">Jon Zhang</text>
    <text x="0" y="184" fill="#202631" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">GenAI / Full-Stack Engineer</text>
    <text x="0" y="226" fill="#303947" font-family="Arial, Helvetica, sans-serif" font-size="17">Intelligent systems · Scalable applications · Real-world products</text>
  </g>

  <g transform="translate(780 70)" filter="url(#shadow)">
    <g transform="rotate(-3 160 120)">
      <rect width="320" height="245" rx="26" fill="#fff" fill-opacity=".78" stroke="#fff" stroke-opacity=".78"/>
      <text x="28" y="44" fill="#3367ff" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">PORTFOLIO / LIVE</text>
      <text x="28" y="94" fill="#11141a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Experience</text>
      <path d="M28 112H292" stroke="#151a22" stroke-opacity=".18"/>
      <text x="28" y="150" fill="#11141a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Projects</text>
      <path d="M28 168H292" stroke="#151a22" stroke-opacity=".18"/>
      <text x="28" y="206" fill="#11141a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Roadmap</text>
      <circle cx="278" cy="86" r="11" fill="#7de7dd"/><circle cx="278" cy="142" r="11" fill="#b8b8ff"/><circle cx="278" cy="198" r="11" fill="#3367ff"/>
    </g>
  </g>

  <g transform="translate(72 350)">
    <rect width="92" height="30" rx="15" fill="#11141a"/><text x="46" y="20" text-anchor="middle" fill="#fff" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">PUBLIC</text>
    <rect x="102" width="102" height="30" rx="15" fill="#fff" fill-opacity=".46" stroke="#fff" stroke-opacity=".5"/><text x="153" y="20" text-anchor="middle" fill="#11141a" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">RESPONSIVE</text>
    <rect x="214" width="122" height="30" rx="15" fill="#fff" fill-opacity=".46" stroke="#fff" stroke-opacity=".5"/><text x="275" y="20" text-anchor="middle" fill="#11141a" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">DEPENDENCY-FREE</text>
  </g>
</svg>
